services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../app:/app/app:rw
      - ../data:/app/data:rw
      - ../alembic:/app/alembic:rw
      - ../alembic.ini:/app/alembic.ini:ro
      # Pre-downloaded ML models (run scripts/download_models.ps1 first)
      - ../ml_model_cache/zoedepth:/app/app/ml_models/zoedepth:ro
      - ../ml_model_cache/mediapipe:/app/app/ml_models/mediapipe:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    command: celery -A app.celery_worker worker --loglevel=info
    env_file:
      - ../.env
    volumes:
      - ../app:/app/app:rw
      - ../data:/app/data:rw
      # Pre-downloaded ML models
      - ../ml_model_cache/zoedepth:/app/app/ml_models/zoedepth:ro
      - ../ml_model_cache/mediapipe:/app/app/ml_models/mediapipe:ro
    depends_on:
      redis:
        condition: service_healthy
