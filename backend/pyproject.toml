[project]
name = "app"
version = "0.1.0"
description = "FastAPI backend with SQLModel, Celery, and JWT authentication"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "pyjwt>=2.10.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
    "python-multipart>=0.0.17",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.2.0",
    "tensorflow==2.16.1",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "pillow==10.2.0",
    "numpy==1.26.3",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pandas>=2.0.0",
    "opencv-python>=4.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
