services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=false
    volumes:
      - uploads_data:/app/uploads
      - ./backend/ml_model_cache/zoedepth:/app/app/ml_models/zoedepth
      - ./backend/ml_model_cache/mediapipe:/app/app/ml_models/mediapipe:ro
    user: root
    command: >
      sh -c "chown -R appuser:appgroup /app/uploads /app/app/ml_models/zoedepth && 
             exec su appuser -s /bin/sh -c 'uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4'"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery_worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.prod
    env_file:
      - .env
    environment:
      - DEBUG=false
    volumes:
      - uploads_data:/app/uploads
      - ./backend/ml_model_cache/zoedepth:/app/app/ml_models/zoedepth
      - ./backend/ml_model_cache/mediapipe:/app/app/ml_models/mediapipe:ro
    user: root
    command: >
      sh -c "chown -R appuser:appgroup /app/uploads /app/app/ml_models/zoedepth && 
             exec su appuser -s /bin/sh -c 'celery -A app.celery_worker worker --loglevel=info --concurrency=4'"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-somalens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Internal only - no external port exposure in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # Internal only - no external port exposure in production
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
